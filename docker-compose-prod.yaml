services:
  mongodb:
    image: mongo:latest
    container_name: mongodb-prod
    ports:
      - "27017:27017"
    volumes:
      - mongodb_prod_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-api:
    image: nguyenthanhtai306/product-api:latest
    container_name: product-api-prod
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/productdb
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_prod_data: